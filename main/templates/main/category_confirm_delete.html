<!DOCTYPE html>
<html>
<head>
    <title>Удаление категории</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .warning { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Удаление категории</h1>

    <p>Вы уверены, что хотите удалить категорию <strong>"{{ category.name }}"</strong>?</p>

    {% if category.products.count > 0 %}
        <p class="warning">⚠️ В этой категории есть товары ({{ category.products.count }} шт.). Удаление категории может повлиять на них.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background: #dc3545; color: white; padding: 10px 15px; border: none;">Да, удалить</button>
        <a href="{% url 'category_list' %}">Отмена</a>
    </form>
</body>
</html>
