<!DOCTYPE html>
<html>
<head>
    <title>Главная</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .welcome { font-size: 24px; margin-bottom: 20px; }
        .links a { margin-right: 15px; }
    </style>
</head>
<body>
    <h1>Добро пожаловать в интернет-магазин!</h1>

    <div class="links">
        <a href="{% url 'product_list' %}">Каталог товаров</a>
        {% if user.is_authenticated %}
            <a href="{% url 'cart_list' %}">Мои корзины</a>
            <a href="{% url 'order_list' %}">Мои заказы</a>
            <a href="{% url 'logout' %}">Выйти ({{ user.username }})</a>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </div>
</body>
</html>
