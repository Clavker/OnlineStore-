<!DOCTYPE html>
<html>
<head>
    <title>Оформление заказа</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        form { max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .cart-summary { background: #f8f9fa; padding: 15px; border-radius: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Оформление заказа</h1>

    <div class="cart-summary">
        <h3>Ваш заказ:</h3>
        {% for item in cart.items.all %}
            <p>{{ item.product.name }} × {{ item.quantity }} = {{ item.product.price|floatformat:2 }} ₽</p>
        {% endfor %}
        <p><strong>Итого: {{ cart.total_price|floatformat:2 }} ₽</strong></p>
    </div>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Подтвердить заказ</button>
    </form>

    <p><a href="{% url 'cart_detail' cart.pk %}">Вернуться в корзину</a></p>
</body>
</html>
