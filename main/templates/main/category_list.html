<!DOCTYPE html>
<html>
<head>
    <title>Категории</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .category { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
        .actions { margin-top: 10px; }
        .actions a, .actions button { margin-right: 10px; }
    </style>
</head>
<body>
    <h1>Категории товаров</h1>

    <a href="{% url 'category_create' %}">➕ Создать категорию</a>

    {% for category in categories %}
        <div class="category">
            <h3>{{ category.name }}</h3>
            <p>Товаров в категории: {{ category.products.count }}</p>
            <div class="actions">
                <a href="{% url 'category_detail' category.pk %}">👁️ Просмотр</a>
                <a href="{% url 'category_update' category.pk %}">✏️ Редактировать</a>
                <a href="{% url 'category_delete' category.pk %}">❌ Удалить</a>
            </div>
        </div>
    {% empty %}
        <p>Категорий пока нет.</p>
    {% endfor %}

    <br>
    <a href="{% url 'product_list' %}">← К товарам</a>
</body>
</html>
