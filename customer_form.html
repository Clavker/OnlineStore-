<!DOCTYPE html>
<html>
<head>
    <title>{% if customer %}Редактировать профиль{% else %}Создать профиль{% endif %}</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        form { max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>{% if customer %}Редактировать профиль{% else %}Создать профиль{% endif %}</h1>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Телефон:</label>
            <input type="text" name="phone" value="{{ customer.phone|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>Страна:</label>
            <input type="text" name="country" value="{{ customer.country|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>Город:</label>
            <input type="text" name="city" value="{{ customer.city|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>Адрес:</label>
            <textarea name="street_address" required>{{ customer.street_address|default:'' }}</textarea>
        </div>
        <button type="submit">Сохранить</button>
        <a href="{% url 'home' %}">Отмена</a>
    </form>
</body>
</html>
